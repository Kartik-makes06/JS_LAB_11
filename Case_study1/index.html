<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sound Wave Live | Concert Registration</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg:#14100d; --card:#1f1a16; --line:#3a3027; --gold:#ffb703; --red:#fb5607; --txt:#f6efe6; --mut:#a89b8c; }
  body { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; background: radial-gradient(circle at 20% 0%, #3b1d0c, var(--bg) 55%); color: var(--txt); min-height: 100vh; padding: 28px 16px; }
  .wrap { max-width: 1050px; margin: auto; display: grid; grid-template-columns: 1.5fr 1fr; gap: 22px; align-items: start; }
  header { grid-column: 1 / -1; text-align: center; margin-bottom: 4px; }
  header small { letter-spacing: .35em; color: var(--gold); font-size: .75rem; }
  header h1 { font-size: 2.6rem; text-transform: uppercase; letter-spacing: .05em; }
  header h1 b { color: var(--red); }
  form, .ticket { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  label, .lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); }
  input, select, textarea { font: inherit; padding: 11px 12px; background: #120e0b; color: var(--txt); border: 1px solid var(--line); border-radius: 10px; color-scheme: dark; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--gold); }
  .err { color: #ff6b6b; font-size: .75rem; min-height: 1em; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips input { display: none; }
  .chips label { text-transform: none; letter-spacing: 0; font-size: .9rem; padding: 8px 16px; border: 1px solid var(--line); border-radius: 99px; cursor: pointer; color: var(--txt); }
  .chips input:checked + label { background: var(--gold); color: #1a1208; border-color: var(--gold); font-weight: 700; }
  .terms { display: flex; gap: 10px; align-items: center; margin: 6px 0 16px; font-size: .88rem; }
  button { width: 100%; padding: 14px; font: inherit; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; border: 0; border-radius: 12px; cursor: pointer; background: linear-gradient(90deg, var(--gold), var(--red)); color: #1a0d05; }
  button:hover { filter: brightness(1.08); }

  .ticket { position: sticky; top: 20px; background: linear-gradient(160deg, #2b2119, #1a1410); border: 2px dashed var(--gold); }
  .ticket h3 { color: var(--gold); letter-spacing: .15em; font-size: .8rem; margin-bottom: 12px; }
  .ticket .big { font-size: 1.5rem; font-weight: 800; margin-bottom: 14px; }
  .ticket dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: .88rem; }
  .ticket dt { color: var(--mut); }
  .ticket dd { text-align: right; word-break: break-word; }
  .total { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 800; color: var(--gold); }
  .saved { margin-top: 16px; font-size: .8rem; color: var(--mut); }

  @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } .ticket { position: static; } header h1 { font-size: 1.9rem; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <small>LIVE &bull; LOUD &bull; UNFORGETTABLE</small>
    <h1>Sound<b>Wave</b> Live</h1>
  </header>

  <form id="reg" novalidate>
    <div class="row">
      <div class="field"><label for="name">Full name</label><input id="name" placeholder="Your name"><span class="err"></span></div>
      <div class="field"><label for="age">Age</label><input id="age" type="number" min="10" max="99" placeholder="18"><span class="err"></span></div>
    </div>
    <div class="row">
      <div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com"><span class="err"></span></div>
      <div class="field"><label for="mobile">Mobile</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="10-digit number"><span class="err"></span></div>
    </div>
    <div class="row">
      <div class="field"><label for="city">City</label><input id="city" placeholder="Nagpur"><span class="err"></span></div>
      <div class="field"><label for="concert">Concert</label>
        <select id="concert">
          <option value="">Choose a show</option>
          <option value="Arijit Singh Night|1500">Arijit Singh Night - Rs 1500</option>
          <option value="Rock Mania|1200">Rock Mania - Rs 1200</option>
          <option value="Sufi Evening|900">Sufi Evening - Rs 900</option>
          <option value="EDM Fest|1800">EDM Fest - Rs 1800</option>
        </select><span class="err"></span></div>
    </div>
    <div class="row">
      <div class="field"><label for="cdate">Concert date</label><input id="cdate" type="date"><span class="err"></span></div>
      <div class="field"><label for="tickets">Tickets</label><input id="tickets" type="number" min="1" max="10" value="1"><span class="err"></span></div>
    </div>
    <div class="field"><span class="lbl">Preferred genre</span>
      <div class="chips" id="genres"></div><span class="err" id="genreErr"></span></div>
    <div class="field"><label for="pay">Payment method</label>
      <select id="pay"><option value="">Select</option><option>UPI</option><option>Credit / Debit Card</option><option>Net Banking</option><option>Pay at venue</option></select><span class="err"></span></div>
    <div class="field"><label for="req">Special requests</label><textarea id="req" rows="3" placeholder="Wheelchair access, seating together..."></textarea></div>
    <div class="terms"><input type="checkbox" id="terms"><label for="terms" style="text-transform:none;letter-spacing:0;font-size:.88rem;color:var(--txt)">I agree to the terms and conditions</label></div>
    <span class="err" id="termsErr"></span>
    <button type="submit">Register for concert</button>
  </form>

  <aside class="ticket">
    <h3>YOUR TICKET PREVIEW</h3>
    <div class="big" id="pShow">Pick a show</div>
    <dl>
      <dt>Name</dt><dd id="pName">-</dd>
      <dt>Date</dt><dd id="pDate">-</dd>
      <dt>Genre</dt><dd id="pGenre">-</dd>
      <dt>Tickets</dt><dd id="pTix">1</dd>
      <dt>Payment</dt><dd id="pPay">-</dd>
    </dl>
    <div class="total"><span>Total</span><span id="pTotal">Rs 0</span></div>
    <p class="saved" id="savedCount"></p>
  </aside>
</div>

<script>
const $ = (id) => document.getElementById(id);
const genres = ['Bollywood', 'Rock', 'Pop', 'Classical', 'Sufi', 'EDM'];
$('genres').innerHTML = genres.map((g, i) =>
  `<input type="radio" name="genre" id="g${i}" value="${g}"><label for="g${i}">${g}</label>`).join('');

$('cdate').min = new Date().toISOString().split('T')[0];

function preview() {
  const [show, price] = ($('concert').value || '|0').split('|');
  $('pShow').textContent = show || 'Pick a show';
  $('pName').textContent = $('name').value || '-';
  $('pDate').textContent = $('cdate').value || '-';
  const g = document.querySelector('input[name=genre]:checked');
  $('pGenre').textContent = g ? g.value : '-';
  const n = Math.max(0, parseInt($('tickets').value) || 0);
  $('pTix').textContent = n;
  $('pPay').textContent = $('pay').value || '-';
  $('pTotal').textContent = 'Rs ' + (Number(price) * n).toLocaleString('en-IN');
}
$('reg').addEventListener('input', preview);
$('reg').addEventListener('change', preview);

function setErr(id, msg) {
  const el = $(id);
  el.parentElement.querySelector('.err').textContent = msg;
  return !msg;
}

function validate() {
  let ok = true;
  ok = setErr('name', $('name').value.trim().length < 3 ? 'Enter your full name' : '') && ok;
  ok = setErr('age', !($('age').value >= 10) ? 'Enter a valid age' : '') && ok;
  ok = setErr('email', !/^\S+@\S+\.\S+$/.test($('email').value) ? 'Enter a valid email' : '') && ok;
  ok = setErr('mobile', !/^[6-9]\d{9}$/.test($('mobile').value) ? 'Enter a valid 10-digit mobile' : '') && ok;
  ok = setErr('city', !$('city').value.trim() ? 'City required' : '') && ok;
  ok = setErr('concert', !$('concert').value ? 'Choose a concert' : '') && ok;
  ok = setErr('cdate', !$('cdate').value ? 'Pick a date' : '') && ok;
  ok = setErr('tickets', !($('tickets').value >= 1 && $('tickets').value <= 10) ? '1 to 10 tickets' : '') && ok;
  ok = setErr('pay', !$('pay').value ? 'Select payment method' : '') && ok;
  const g = document.querySelector('input[name=genre]:checked');
  $('genreErr').textContent = g ? '' : 'Pick a genre'; ok = !!g && ok;
  $('termsErr').textContent = $('terms').checked ? '' : 'Please accept the terms'; ok = $('terms').checked && ok;
  return ok;
}

function refreshCount() {
  const n = (JSON.parse(localStorage.getItem('concertRegs')) || []).length;
  $('savedCount').textContent = n ? `${n} registration(s) saved in this browser` : '';
}

$('reg').addEventListener('submit', (e) => {
  e.preventDefault();
  if (!validate()) return;
  const data = {
    name: $('name').value.trim(), age: $('age').value, email: $('email').value, mobile: $('mobile').value,
    city: $('city').value.trim(), concert: $('concert').value.split('|')[0], date: $('cdate').value,
    genre: document.querySelector('input[name=genre]:checked').value, tickets: $('tickets').value,
    payment: $('pay').value, request: $('req').value.trim(), savedAt: new Date().toISOString()
  };
  const all = JSON.parse(localStorage.getItem('concertRegs')) || [];
  all.push(data);
  localStorage.setItem('concertRegs', JSON.stringify(all));
  alert('Concert registration saved successfully!');
  e.target.reset(); $('tickets').value = 1; preview(); refreshCount();
});
refreshCount(); preview();
</script>
</body>
</html>
